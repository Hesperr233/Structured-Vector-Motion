name: Video repair R1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  IMPLEMENTATION_SHA: a8f211bea533c2101200db620fe6d8ee47b4ecf8
  CONTRACT_SHA: 52180bd1e71b3b23b2e7cbbe2e236b05f944f2a3

jobs:
  oracle:
    name: Video scoring and fixture self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CI_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "Pillow==12.3.0" "numpy==2.5.4"
      - run: python -m unittest discover -s tests -p 'test_video_repair_*.py' -v
      - run: python -m unittest discover -s tests -p test_fixture.py -v

  compatibility:
    name: R1-002 candidate A and B evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CI_SHA }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMPLEMENTATION_SHA }}
          path: implementation
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTRACT_SHA }}
          path: contract
          persist-credentials: false
      - name: Verify exact checkouts
        run: |
          test "$(git rev-parse HEAD)" = "$CI_SHA"
          test "$(git -C implementation rev-parse HEAD)" = "$IMPLEMENTATION_SHA"
          test "$(git -C contract rev-parse HEAD)" = "$CONTRACT_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "./implementation[geometry,svg,trace,analysis]" "Pillow==12.3.0" "numpy==2.5.4"
      - uses: ./.github/actions/c-video-tools
        id: tools
        with:
          resvg: "true"
      - name: Run retained prototype compatibility checks against the latest candidate
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: python tests/test_video_repair_candidate.py --candidate implementation --output video-evidence/compatibility
      - name: Run A development sample and media checks
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: python tests/test_video_repair_r1_synthetic.py --candidate implementation --output video-evidence/synthetic
      - name: Run B Motion provenance and media checks
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: python tests/test_video_repair_r1_motion.py --candidate implementation --output video-evidence/motion --resvg resvg
      - name: Preserve allowlisted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-repair-r1-002-evidence
          path: |
            tool-evidence/setup.log
            video-evidence/compatibility/compatibility.json
            video-evidence/compatibility/*.mp4
            video-evidence/synthetic/acceptance-report.json
            video-evidence/synthetic/failures.log
            video-evidence/synthetic/*/manifest.json
            video-evidence/synthetic/*/metrics.json
            video-evidence/synthetic/*/preview-*.png
            video-evidence/synthetic/*/*.mp4
            video-evidence/motion/acceptance-report.json
            video-evidence/motion/failures.log
            video-evidence/motion/*manifest.json
            video-evidence/motion/metrics.json
            video-evidence/motion/preview-*.png
            video-evidence/motion/*.mp4
          if-no-files-found: error
          retention-days: 7

  acceptance:
    name: Formal video repair acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTRACT_SHA }}
          persist-credentials: false
      - name: Record blockers for the pinned draft and candidate
        shell: bash
        run: |
          mkdir -p video-gate
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          criteria = Path("docs/c-video-repair/acceptance-criteria-v0.1.md")
          draft = "**DRAFT**" in criteria.read_text(encoding="utf-8")
          evidence = {
              "status": "BLOCKED",
              "contract": "c-video-repair-contract@0.1",
              "contract_revised_as": "R1-002",
              "contract_status": "DRAFT" if draft else "REQUIRES REVIEW",
              "contract_docs_sha": os.environ["CONTRACT_SHA"],
              "implementation_sha": os.environ["IMPLEMENTATION_SHA"],
              "ci_sha": os.environ["CI_SHA"],
              "not_run": [
                  "frozen H1–H5",
                  "formal ingest, repair, export and verify stages",
                  "formal B acceptance",
              ],
          }
          Path("video-gate/acceptance-status.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )
          PY
          echo "::error::Formal acceptance BLOCKED. The pinned candidate and draft lack formal verification and frozen holdout evidence."
          exit 1
      - name: Preserve gate status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-repair-acceptance-status
          path: video-gate/acceptance-status.json
          if-no-files-found: error
          retention-days: 7
